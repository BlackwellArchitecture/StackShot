[package]
name = "stackshot"
version = "1.0.0"
description = "Lightweight, high-performance image stacking desktop application"
authors = ["StackShot"]
edition = "2021"

[lib]
name = "stackshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-global-shortcut = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "tiff",
    "gif",
    "ico",
] }
rayon = "1.10"
arboard = "3.4"
base64 = "0.22"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"
